# ============================================================
# 第2层：参数配置层
# 所有参数可在此修改，无需重新编译。
# 此文件被 1_launcher/main.cpp 和 0_experiments/run.cpp 读取
# ============================================================

# ===== 问题规模 =====
num_dc: 3
num_retailers: 10

# ===== 遗传算法参数 =====
population_size: 30               # 种群大小（论文：30）
max_generation: 50                # 最大迭代次数（论文：50）
crossover_rate: 0.7               # 交叉概率（论文：0.7）
mutation_rate: 0.2                # 变异概率（论文：0.2）
elitism: true                     # 精英保留
chromosome_length: 10             # w_j编码位数（10位=3位小数）
min_w: 0.0                        # 减排率下限
max_w: 1.0                        # 减排率上限

# ===== 碳交易参数 =====
carbon_price: 2.0                 # p̂：碳配额交易价格
carbon_cap: 100000.0              # C：初始碳排放配额
inv_carbon_coeff: 2.0             # ĥ：单位库存年碳排放量
transport_carbon_coeff: 0.01      # k：运输碳排放系数
fac_carbon_ratio: 0.1             # f̂_j = f_j * 0.1（设施碳排放系数）

# ===== 减排参数 =====
delta: 5000.0                     # δ：减排成本系数（论文表5-1基准值）
                                  # 灵敏度分析取 [1000,3000,...,17000]

# ===== 服务水平 =====
service_level: 0.975              # α：服务水平 97.5%
z_alpha: 1.96                     # z_α：标准正态分位数

# ===== 成本参数 =====
order_fixed_cost: 100.0           # F_j：订货固定成本
transport_fixed_cost: 100.0       # g_j：运输固定成本
lead_time: 1.0                    # L_j：补货提前期（天）
holding_cost: 10.0                # h：单位商品年库存持有成本（论文表5-1：10）

# ===== 公式模型选择（第3层公式开关）=====
use_sqrt_investment: true         # true=½δw²√D（论文标准版） false=½βw²（旧版）
use_paper_algorithm3: false       # true=论文Algorithm3（完整凸包+余弦相似度+I1/I2/I3分类）

# ===== 随机种子（单次运行时使用，批量实验由实验方案指定）=====
random_seed: 32501

# ===== 数据生成范围（论文3.5.1节 / 4.5.1节）=====
coord_min: 0.0
coord_max: 1000.0
mu_min: 2000.0
mu_max: 3500.0
var_min: 10.0
var_max: 15.0
fixed_cost_min: 7000.0
fixed_cost_max: 10000.0
reserve_price_min: 60.0
reserve_price_max: 80.0
supplier_x: 500.0
supplier_y: 500.0

# ===== 输出控制 =====
verbose: false                    # 是否输出详细日志
output_dir: results               # 输出目录
log_file: ""                      # 日志文件路径（空=只输出到控制台）

# ===== 分支定界参数 =====
rc_eps: 1.0e-6                    # 检验数收敛精度
max_branch_nodes: 10000           # 最大分支节点数
use_dfs: true                     # true=深度优先 false=广度优先

# ===== 原代码兼容模式 =====
legacy_mode: false                # true=使用原GA_BP.cpp的数据生成方式
