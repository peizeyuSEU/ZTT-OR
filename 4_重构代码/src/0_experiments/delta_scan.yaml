plan_name: "Delta扫描 — 寻找合适参数"
plan_desc: "固定其他参数为论文标准值，扫描不同delta值，观察总利润、碳排放、w范围"

# 全局默认参数
num_dc: 3
num_retailers: 10
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true

experiments:
  - name: "delta1000"
    delta: 1000
  - name: "delta3000"
    delta: 3000
  - name: "delta5000"
    delta: 5000
  - name: "delta7000"
    delta: 7000
  - name: "delta10000"
    delta: 10000
