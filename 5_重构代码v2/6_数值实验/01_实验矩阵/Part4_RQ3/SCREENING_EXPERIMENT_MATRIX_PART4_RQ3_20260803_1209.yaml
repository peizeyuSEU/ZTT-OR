required_audits:
  config_audit:
  - Confirm carbon_price and carbon_cap are effective in resolved configuration.
  - Confirm delta=3000 and investment_exponent=0.5.
  - Confirm best_w contains exactly 10 candidate-DC values.
  - Confirm unknown YAML fields are not silently ignored.
  carbon_trading_identity:
  - e_plus=max(E-C,0)
  - e_minus=max(C-E,0)
  - net_carbon_trading_cost=carbon_price*(E-C)
  cap_identity:
  - profit(C2)-profit(C1)=carbon_price*(C2-C1)
  fingerprint_audit:
  - Use base_instance_fingerprint to compare the same seed across policy scenarios.
  - Exclude carbon_price, carbon_cap, scenario_id, output path, and timestamps from base_instance_fingerprint.
  result_boundary:
  - Do not use monotonic trends as an acceptance condition.
  - Do not delete or replace seeds because results are not smooth.

