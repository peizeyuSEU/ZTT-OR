plan_name: "mutation_sensitivity_pilot_5x20"
plan_desc: "GA逐位变异率pilot：同一实例、同一seed、同一预算，仅改变mutation_rate"

num_dc: 5
num_retailers: 20
random_seed: 32501
run_mode: ga

population_size: 12
max_generation: 8
crossover_rate: 0.7
chromosome_length: 10
elitism: true
early_stop: false

use_sqrt_investment: true
investment_exponent: 0.5
use_invest_in_column: true

pricing_algorithm: 0
pricing_max_cols_per_dc: 1
max_cg_iterations: 1000
cg_early_stop: false
max_branch_nodes: 10000
bp_time_limit_sec: 600
bp_relative_gap: 0

parallel_fitness: false
parallel_pricing: false
cplex_threads: 1

experiments:
  - name: "mutation_adaptive_1_over_L"
    mutation_rate: -1
  - name: "mutation_001"
    mutation_rate: 0.01
  - name: "mutation_005"
    mutation_rate: 0.05
  - name: "mutation_010"
    mutation_rate: 0.10
  - name: "mutation_020"
    mutation_rate: 0.20
