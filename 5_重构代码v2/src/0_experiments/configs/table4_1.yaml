# ============================================================
# 第0层：实验方案 — 论文表4.1
# 不同问题规模下的 GA+BP 求解结果
# ============================================================

# ===== 实验方案元信息 =====
plan_name: "表4.1"
plan_desc: "不同问题规模下的GA+BP求解结果"

# ===== 全局默认参数（可被 experiments 列表中的条目覆盖）=====

# 问题规模（默认值，被条目覆盖）
num_dc: 3
num_retailers: 10

# 遗传算法参数
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
elitism: true
chromosome_length: 10
min_w: 0.0
max_w: 1.0

# 碳交易参数
carbon_price: 2.0
carbon_cap: 100000.0
inv_carbon_coeff: 2.0
transport_carbon_coeff: 0.01
fac_carbon_ratio: 0.1

# 减排参数
delta: 5000.0

# 服务水平
service_level: 0.975
z_alpha: 1.96

# 成本参数
order_fixed_cost: 100.0
transport_fixed_cost: 100.0
lead_time: 1.0
holding_cost: 10.0

# 随机种子
random_seed: 32501

# 数据生成范围
coord_min: 0.0
coord_max: 1000.0
mu_min: 2000.0
mu_max: 3500.0
var_min: 10.0
var_max: 15.0
fixed_cost_min: 7000.0
fixed_cost_max: 10000.0
reserve_price_min: 60.0
reserve_price_max: 80.0
supplier_x: 500.0
supplier_y: 500.0

# 输出控制
verbose: false
output_dir: results
log_file: ""

# 分支定界参数
rc_eps: 1.0e-6
max_branch_nodes: 10000
use_dfs: true

# 公式模型选择
use_sqrt_investment: true

# 定价子问题算法选择
use_paper_algorithm3: false

# 兼容模式
legacy_mode: false

# ===== 实验列表 =====
experiments:
  - name: "scale_3_5"
    num_dc: 3
    num_retailers: 5

  - name: "scale_3_10"
    num_dc: 3
    num_retailers: 10

  - name: "scale_5_10"
    num_dc: 5
    num_retailers: 10

  - name: "scale_5_20"
    num_dc: 5
    num_retailers: 20

  - name: "scale_5_30"
    num_dc: 5
    num_retailers: 30
