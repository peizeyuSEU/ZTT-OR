plan_name: "多列纯根节点CG探针 50x200"
plan_desc: "关BB(max_branch_nodes=1)只求根LP,剥离BB扰动,纯净度量多列在CG层加速能力(单列 vs 多列3/5/10)"

# ===== 公共基准参数 =====
num_dc: 50
num_retailers: 200
population_size: 1
max_generation: 1
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false
parallel_fitness: false

# 关BB:只求根节点LP,剥离分支扰动
max_branch_nodes: 1

# CG层收敛控制
max_cg_iterations: 500
cg_early_stop: true
cg_stall_tolerance: 0.0001
cg_stall_iterations: 15

experiments:
  - name: "R1_Single"
    parallel_pricing: false
    pricing_max_cols_per_dc: 1
  - name: "R2_Multi3"
    parallel_pricing: false
    pricing_max_cols_per_dc: 3
  - name: "R3_Multi5"
    parallel_pricing: false
    pricing_max_cols_per_dc: 5
  - name: "R4_Multi10"
    parallel_pricing: false
    pricing_max_cols_per_dc: 10