# ============================================================
# 推荐基准实验 — 第0层实验方案
# 核心参数：delta=3000，其他保持论文标准值
# ============================================================
plan_name: "基准实验_delta3000"
plan_desc: "delta=3000下不同问题规模的GA+BP求解结果"

# ===== 全局默认参数（delta=3000）=====
num_dc: 3
num_retailers: 10
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
elitism: true
chromosome_length: 10
min_w: 0.0
max_w: 1.0
carbon_price: 2.0
carbon_cap: 100000.0
inv_carbon_coeff: 2.0
transport_carbon_coeff: 0.01
fac_carbon_ratio: 0.1
delta: 3000.0
service_level: 0.975
z_alpha: 1.96
order_fixed_cost: 100.0
transport_fixed_cost: 100.0
lead_time: 1.0
holding_cost: 10.0
random_seed: 32501
coord_min: 0.0
coord_max: 1000.0
mu_min: 2000.0
mu_max: 3500.0
var_min: 10.0
var_max: 15.0
fixed_cost_min: 7000.0
fixed_cost_max: 10000.0
reserve_price_min: 60.0
reserve_price_max: 80.0
supplier_x: 500.0
supplier_y: 500.0
verbose: false
output_dir: results
log_file: ""
rc_eps: 1.0e-6
max_branch_nodes: 10000
use_dfs: true
use_sqrt_investment: true
use_paper_algorithm3: false
legacy_mode: false

experiments:
  - name: "scale_3_5"
    num_dc: 3
    num_retailers: 5

  - name: "scale_3_10"
    num_dc: 3
    num_retailers: 10

  - name: "scale_5_10"
    num_dc: 5
    num_retailers: 10

  - name: "scale_5_20"
    num_dc: 5
    num_retailers: 20

  - name: "scale_5_30"
    num_dc: 5
    num_retailers: 30
