# ============================================================
# 第0层：实验方案 — 单次验证
# ============================================================

plan_name: "verify"
plan_desc: "单次验证实验 #DCs=3, #Rts=10, δ=5000"

# ===== 问题规模 =====
num_dc: 3
num_retailers: 10

# ===== 遗传算法 =====
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
elitism: true
chromosome_length: 10
min_w: 0.0
max_w: 1.0

# ===== 碳交易 =====
carbon_price: 2.0
carbon_cap: 100000.0
inv_carbon_coeff: 2.0
transport_carbon_coeff: 0.01
fac_carbon_ratio: 0.1

# ===== 减排 =====
delta: 5000.0

# ===== 服务水平 =====
service_level: 0.975
z_alpha: 1.96

# ===== 成本 =====
order_fixed_cost: 100.0
transport_fixed_cost: 100.0
lead_time: 1.0
holding_cost: 10.0

# ===== 随机种子 =====
random_seed: 32501

# ===== 数据生成 =====
coord_min: 0.0
coord_max: 1000.0
mu_min: 2000.0
mu_max: 3500.0
var_min: 10.0
var_max: 15.0
fixed_cost_min: 7000.0
fixed_cost_max: 10000.0
reserve_price_min: 60.0
reserve_price_max: 80.0
supplier_x: 500.0
supplier_y: 500.0

# ===== 输出控制 =====
verbose: false
output_dir: results
log_file: ""

# ===== 分支定界 =====
rc_eps: 1.0e-6
max_branch_nodes: 10000
use_dfs: true

# ===== 公式与算法开关 =====
use_sqrt_investment: true
use_paper_algorithm3: false
legacy_mode: false

# ===== 实验列表 =====
experiments:
  - name: "verify"
    # 所有参数继承默认值
