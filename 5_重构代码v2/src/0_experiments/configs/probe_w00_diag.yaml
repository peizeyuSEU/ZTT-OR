plan_name: "w00死循环诊断-对偶平滑对照"
plan_desc: "单独跑 30x100_w00：A=默认平滑(alpha=0.5) B=关平滑(alpha=0)，验证对偶平滑是否为cycling根因"

# ===== 公共基准参数（与 probe_small 一致）=====
population_size: 1
max_generation: 1
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false
parallel_fitness: false

# CG 层收敛控制
max_cg_iterations: 300
cg_early_stop: true
cg_stall_tolerance: 0.0001
cg_stall_iterations: 15

# BB 层
max_branch_nodes: 10000

# 并行策略
parallel_pricing: false
pricing_threads: 4
cplex_threads: 1

experiments:
  - name: "30x100_w00_smoothON"
    num_dc: 30
    num_retailers: 100
    min_w: 0.0
    max_w: 0.0
    dual_smooth_alpha: 0.5

  - name: "30x100_w00_smoothOFF"
    num_dc: 30
    num_retailers: 100
    min_w: 0.0
    max_w: 0.0
    dual_smooth_alpha: 0.0