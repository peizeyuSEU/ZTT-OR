plan_name: "多列定价对比 40x150"
plan_desc: "40DC x 150R 对比单列(baseline)与多列定价(K=5),验证轮数降且解不变"

# ===== 公共基准参数 =====
num_dc: 40
num_retailers: 150
population_size: 1
max_generation: 1
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false
parallel_fitness: false

# CG层收敛控制
max_cg_iterations: 300
cg_early_stop: true
cg_stall_tolerance: 0.0001
cg_stall_iterations: 15

experiments:
  - name: "M1_SingleCol"
    parallel_pricing: false
    pricing_max_cols_per_dc: 1
  - name: "M2_MultiCol5"
    parallel_pricing: false
    pricing_max_cols_per_dc: 5
