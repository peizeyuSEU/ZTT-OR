plan_name: "algo_compare"
plan_desc: "同规模同种子,对比Simplified(两两连线)与ConvexHull(凸包)的解是否一致及PS耗时"

# ===== 公共基准参数(所有实验条目继承,可被条目覆盖) =====
num_dc: 10
num_retailers: 30
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false          # 关早停,跑满50代,两算法遍历路径可比
parallel_fitness: false    # 全串行,保证两算法在完全相同的对偶序列下求解,便于逐点对齐
parallel_pricing: false

experiments:
  # 基准: Simplified 两两连线(当前默认,视为正确参照)
  - name: "Simplified"
    pricing_algorithm: 0

  # 待验证: ConvexHull 凸包剪枝(期望解完全一致,PS大幅下降)
  - name: "ConvexHull"
    pricing_algorithm: 2