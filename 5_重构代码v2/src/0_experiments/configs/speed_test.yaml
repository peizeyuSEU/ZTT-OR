plan_name: "速度测试"
plan_desc: "对比串行、并行、提前停止的加速效果"

num_dc: 3
num_retailers: 10
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true

experiments:
  - name: "串行_50代"
    parallel_fitness: false
    early_stop: false
  - name: "并行_50代"
    parallel_fitness: true
    num_threads: 0
    early_stop: false
  - name: "串行_早停"
    parallel_fitness: false
    early_stop: true
    convergence_generations: 10
  - name: "并行_早停"
    parallel_fitness: true
    num_threads: 0
    early_stop: true
    convergence_generations: 10
