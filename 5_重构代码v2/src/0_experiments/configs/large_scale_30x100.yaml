plan_name: "大规模并行策略验证"
plan_desc: "30DC x 100零售商,验证真正大规模下定价并行/CPLEX多线程是否翻盘"

# ===== 公共基准参数 =====
num_dc: 30
num_retailers: 100
population_size: 10        # 缩小种群,关注单次BP内部CG/定价/CPLEX加速比而非解质量
max_generation: 5         # 降代数,保证5组能在合理时间跑完对比
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false         # 关GA层早停,各组代数一致
parallel_fitness: false   # GA串行,避免fork子进程强制回退干扰CPLEX/定价线程观测

# CG层收敛控制:大规模相对改善判据(1e-6)太严会跑数千轮,放宽+设上限保证可比
max_cg_iterations: 300    # CG最大迭代轮数上限,防尾部无效迭代失控
cg_early_stop: true
cg_stall_tolerance: 0.0001  # 相对改善<1e-4即视为收敛(默认1e-6在大规模永不触发)
cg_stall_iterations: 15

experiments:
  # 基准:全串行
  - name: "L_Serial"
    parallel_pricing: false
    pricing_threads: 4
    cplex_threads: 1

  # 方案B:仅定价并行(逐DC定价并行,15路可分)
  - name: "L_ParPricing"
    parallel_pricing: true
    pricing_threads: 4
    cplex_threads: 1

  # 仅CPLEX 4线程加速RMP求解
  - name: "L_Cplex4"
    parallel_pricing: false
    pricing_threads: 4
    cplex_threads: 4

  # 仅CPLEX 8线程加速RMP求解
  - name: "L_Cplex8"
    parallel_pricing: false
    pricing_threads: 4
    cplex_threads: 8

  # 组合:定价并行 + CPLEX 4线程
  - name: "L_Par_Cplex4"
    parallel_pricing: true
    pricing_threads: 4
    cplex_threads: 4