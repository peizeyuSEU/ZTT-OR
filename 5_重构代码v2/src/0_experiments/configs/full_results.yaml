plan_name: "完整实验结果 — δ=3000, p̂=2（最优参数）"
plan_desc: "用选定的最优参数（δ=3000, p̂=2）跑论文表4.1的全部5种规模"

# 全局默认参数
num_dc: 3
num_retailers: 10
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true

experiments:
  - name: "3x5"
    num_dc: 3
    num_retailers: 5
    delta: 3000
  - name: "3x10"
    num_dc: 3
    num_retailers: 10
    delta: 3000
  - name: "5x10"
    num_dc: 5
    num_retailers: 10
    delta: 3000
  - name: "5x20"
    num_dc: 5
    num_retailers: 20
    delta: 3000
  - name: "5x30"
    num_dc: 5
    num_retailers: 30
    delta: 3000
