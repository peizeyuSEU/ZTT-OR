plan_name: "规模x策略矩阵"
plan_desc: "3种规模 x 4种并行策略=12条,回答'何种规模用何策略最快'"

# ===== 公共基准参数 =====
population_size: 30
max_generation: 30        # 规模大时代数适当降低,控制总时长
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false

experiments:
  # ---------- 小规模 3 DC x 10 零售商 ----------
  - name: "S_small_A_全串行"
    num_dc: 3
    num_retailers: 10
    parallel_fitness: false
    parallel_pricing: false
  - name: "S_small_B_仅GA并行"
    num_dc: 3
    num_retailers: 10
    parallel_fitness: true
    parallel_pricing: false
    num_threads: 0
  - name: "S_small_C_仅定价并行"
    num_dc: 3
    num_retailers: 10
    parallel_fitness: false
    parallel_pricing: true
    num_threads: 0
  - name: "S_small_D_双开"
    num_dc: 3
    num_retailers: 10
    parallel_fitness: true
    parallel_pricing: true
    num_threads: 0

  # ---------- 中规模 10 DC x 30 零售商 ----------
  - name: "M_mid_A_全串行"
    num_dc: 10
    num_retailers: 30
    parallel_fitness: false
    parallel_pricing: false
  - name: "M_mid_B_仅GA并行"
    num_dc: 10
    num_retailers: 30
    parallel_fitness: true
    parallel_pricing: false
    num_threads: 0
  - name: "M_mid_C_仅定价并行"
    num_dc: 10
    num_retailers: 30
    parallel_fitness: false
    parallel_pricing: true
    num_threads: 0
  - name: "M_mid_D_双开"
    num_dc: 10
    num_retailers: 30
    parallel_fitness: true
    parallel_pricing: true
    num_threads: 0

  # ---------- 大规模 30 DC x 100 零售商 ----------
  - name: "L_large_A_全串行"
    num_dc: 30
    num_retailers: 100
    parallel_fitness: false
    parallel_pricing: false
  - name: "L_large_B_仅GA并行"
    num_dc: 30
    num_retailers: 100
    parallel_fitness: true
    parallel_pricing: false
    num_threads: 0
  - name: "L_large_C_仅定价并行"
    num_dc: 30
    num_retailers: 100
    parallel_fitness: false
    parallel_pricing: true
    num_threads: 0
  - name: "L_large_D_双开"
    num_dc: 30
    num_retailers: 100
    parallel_fitness: true
    parallel_pricing: true
    num_threads: 0