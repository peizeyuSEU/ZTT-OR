plan_name: "规模摸底-小规模"
plan_desc: "20x70 / 30x100 两档规模 x w=0.0/0.5，单个体单次求解，验证batch(含BB修复)并观测求解开销"

# ===== 公共基准参数（含最新 BB 修复口径）=====
population_size: 1          # 单个体：只测单次 BP 求解开销，不做 GA 优化
max_generation: 1          # 单代
crossover_rate: 0.7
mutation_rate: 0.2
chromosome_length: 10
carbon_price: 2.0
carbon_cap: 100000.0
delta: 3000
holding_cost: 10.0
random_seed: 32501
use_sqrt_investment: true
early_stop: false          # 关 GA 层早停
parallel_fitness: false    # GA 串行，避免 fork 子进程干扰观测

# CG 层收敛控制：大规模放宽相对改善判据 + 设迭代上限，防尾部失控
max_cg_iterations: 300
cg_early_stop: true
cg_stall_tolerance: 0.0001
cg_stall_iterations: 15

# BB 层：节点上限（沿用基准），负 gap 修复已在代码内
max_branch_nodes: 10000

# 并行策略（摸底统一串行基准，聚焦规模开销）
parallel_pricing: false
pricing_threads: 4
cplex_threads: 1

experiments:
  - name: "20x70_w00"
    num_dc: 20
    num_retailers: 70
    min_w: 0.0
    max_w: 0.0

  - name: "20x70_w05"
    num_dc: 20
    num_retailers: 70
    min_w: 0.5
    max_w: 0.5

  - name: "30x100_w00"
    num_dc: 30
    num_retailers: 100
    min_w: 0.0
    max_w: 0.0

  - name: "30x100_w05"
    num_dc: 30
    num_retailers: 100
    min_w: 0.5
    max_w: 0.5