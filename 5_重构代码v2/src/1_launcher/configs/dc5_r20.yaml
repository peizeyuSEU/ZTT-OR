# 5×20 规模配置（5 个配送中心，20 个零售商）
# 用于验证列生成死循环修复（max_cg_iterations 保护）

# ===== 问题规模 =====
num_dc: 5
num_retailers: 20

# ===== 遗传算法参数 =====
population_size: 30
max_generation: 50
crossover_rate: 0.7
mutation_rate: 0.2
elitism: true
chromosome_length: 10

# ===== 碳交易 / 减排 =====
delta: 3000.0
carbon_price: 2.0
carbon_cap: 100000.0

# ===== 列生成保护 =====
rc_eps: 1.0e-6
max_cg_iterations: 2000

# ===== 随机种子 =====
random_seed: 32501

# ===== 运行模式 =====
run_mode: ga

# ===== 输出控制 =====
verbose: false